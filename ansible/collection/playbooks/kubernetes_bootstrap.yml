---
- name: Initialize Kubernetes control plane
  hosts: k8s_control_plane
  become: true
  gather_facts: true
  roles:
    - role: dblinkhorn.k8s_homelab.kubeadm_control_plane

- name: Join Kubernetes worker nodes
  hosts: k8s_workers
  become: true
  gather_facts: false
  roles:
    - role: dblinkhorn.k8s_homelab.kubeadm_worker

- name: Install Cilium and validate cluster
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - role: dblinkhorn.k8s_homelab.cilium
